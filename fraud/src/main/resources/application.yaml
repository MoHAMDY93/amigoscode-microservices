server:
  port: 8081

spring:
  application:
    name: fraud
  datasource:
    password: 123
    url: jdbc:postgresql://localhost:5432/fraud
    username: admin
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  output:
    ansi:
      enabled: always