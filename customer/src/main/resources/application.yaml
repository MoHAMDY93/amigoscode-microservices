server:
  port: 8080

spring:
  application:
    name: customer
  datasource:
    password: 123
    url: jdbc:postgresql://localhost:5432/customer
    username: admin
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  output:
    ansi:
      enabled: always